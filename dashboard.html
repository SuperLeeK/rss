<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS 피드 관리자</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-blue: #00f2fe;
      --neon-purple: #4facfe;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Background Neon Orbs */
    .orb-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: -100px;
      left: -100px;
      z-index: -1;
    }
    .orb-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -100px;
      right: -100px;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 700px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Back Button Link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s ease;
    }
    .back-link:hover {
      color: var(--neon-blue);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.05em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Glassmorphism Card Style */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      margin-bottom: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .input-row input[type="text"], .input-row input[type="password"] {
      width: auto;
      flex: 1;
    }
    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-blue) 100%);
      color: #0f172a;
      font-weight: 600;
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Keyword List Style */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .section-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .keyword-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .keyword-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 1.1rem 1.25rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .keyword-item:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.5);
    }

    /* Loading Overlay & State */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 0;
      gap: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-blue);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 1500;
    }
    .overlay.active {
      display: flex;
    }
    .overlay-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 2000;
    }
    .toast {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      color: var(--text-main);
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.active {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.danger { border-left-color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .empty-state i {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: block;
      color: rgba(255, 255, 255, 0.1);
    }

    /* Modal Overlay & container styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-container {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover {
      color: var(--text-main);
    }
    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
    }
    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <div class="container">
    <a href="./" class="back-link"><i class="fa-solid fa-arrow-left"></i> 포털 메인으로 돌아가기</a>
    
    <header>
      <h1 id="dashboardTitle">RSS Dashboard</h1>
      <p id="dashboardDescription">로딩 중...</p>
    </header>

    <!-- Active Credentials Info Banner -->
    <div class="card" id="credentialsInfoCard" style="display: none; padding: 1.2rem 1.5rem; margin-bottom: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
        <div style="display: flex; align-items: center; gap: 0.6rem; color: var(--text-muted);">
          <i class="fa-brands fa-github" style="color: var(--neon-blue); font-size: 1.2rem;"></i>
          <span>연동 저장소: <strong id="connectedRepoName" style="color: var(--text-main);">SuperLeeK/rss</strong></span>
        </div>
        <button id="editSettingsBtn" style="background: none; border: none; padding: 0; color: var(--neon-blue); text-decoration: none; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 0.25rem;">
          대시보드 설정 수정 <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>

    <!-- No Credentials Error Card -->
    <div class="card" id="authErrorCard" style="display: none; text-align: center; padding: 3rem 2rem;">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom: 1.5rem;"></i>
      <h2 style="font-size: 1.4rem; margin-bottom: 0.75rem;">GitHub 인증 정보가 없습니다</h2>
      <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; font-size: 0.95rem;">
        RSS 피드 관리를 하려면 GitHub Personal Access Token(PAT)과 저장소 인증 설정이 필요합니다. <br>
        포털 메인 화면에서 설정을 완료한 후 대시보드에 입장해 주세요.
      </p>
      <div style="display: flex; justify-content: center;">
        <a href="./" class="btn-primary" style="text-decoration: none; padding: 0.8rem 2rem; border-radius: 8px;">
          <i class="fa-solid fa-arrow-left"></i> 포털 메인으로 가기
        </a>
      </div>
    </div>

    <!-- Keyword Management Card -->
    <div class="card" id="managerCard" style="display: none;">
      <div class="section-header">
        <h2>수집 키워드 리스트</h2>
        <span class="badge" id="keywordCount">0</span>
      </div>

      <!-- Keyword Add Form -->
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <div class="input-row">
          <input type="text" id="newKeywordInput" placeholder="새 수집 키워드 입력 (예: 유머, 인벤)">
          <button class="btn-primary" id="addKeywordBtn"><i class="fa-solid fa-plus"></i> 추가</button>
        </div>
      </div>

      <!-- Keywords Render Location -->
      <div id="loadingKeywords" class="loading-container">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.85rem;">저장소에서 설정 파싱 및 로딩 중...</p>
      </div>

      <div class="keyword-list" id="keywordList" style="display: none;">
        <!-- Javascript Renders Here -->
      </div>
    </div>
  </div>

  <!-- Dashboard Configuration Modal (Portal 과 100% 동일) -->
  <div class="modal-overlay" id="dashboardModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>대시보드 설정 수정</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>대시보드 ID (고유키 - 수정 불가)</label>
          <input type="text" id="modalSiteId" readonly style="background: rgba(255, 255, 255, 0.03);">
        </div>
        <div class="form-group">
          <label>대시보드 이름</label>
          <input type="text" id="modalSiteName" placeholder="예: 와이고수 RSS">
        </div>
        <div class="form-group">
          <label>설명</label>
          <input type="text" id="modalSiteDesc" placeholder="대시보드에 대한 짧은 설명">
        </div>
        <div class="form-group">
          <label>대상 URL 템플릿 (${keyword} 변수 필수 포함)</label>
          <input type="text" id="modalUrlTemplate" placeholder="예: https://aagag.com/mirror/?word=${keyword}">
        </div>
        <div class="form-group">
          <label>목록 로딩 대기 선택자 (List CSS Selector)</label>
          <input type="text" id="modalListSelector" placeholder="예: table.aalist (비워둘 수 있음)">
        </div>
        <div class="form-group">
          <label>기사 아이템 선택자 (Item CSS Selector)</label>
          <input type="text" id="modalItemSelector" placeholder="예: tr td a.article">
        </div>
        <div class="form-group">
          <label>제목 추출 선택자 (Title CSS Selector - 선택)</label>
          <input type="text" id="modalTitleSelector" placeholder="예: span.title (비워두면 아이템 자체 텍스트 추출)">
        </div>
        <div class="form-group">
          <label>링크 추출 선택자 (Link CSS Selector - 선택)</label>
          <input type="text" id="modalLinkSelector" placeholder="비워두면 아이템의 href 속성 자동 사용">
        </div>
        <div class="form-group">
          <label>수집 주기 (Interval)</label>
          <select id="modalInterval">
            <option value="10">10분</option>
            <option value="30">30분</option>
            <option value="60">1시간</option>
            <option value="120">2시간</option>
            <option value="240">4시간</option>
            <option value="720">12시간</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelModalBtn">취소</button>
        <button class="btn-primary" id="submitModalBtn">설정 저장</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Loading Overlay -->
  <div class="overlay" id="loadingOverlay">
    <div class="spinner" style="width: 50px; height: 50px;"></div>
    <div class="overlay-text" id="overlayText">깃허브 데이터 업데이트 중...</div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // LocalStorage Configuration
    const CONFIG = {
      token: '',
      repo: '',
      sha: '' // config.json 파일의 Github SHA
    };
    
    let currentSiteId = ''; // 쿼리에서 파싱된 대시보드 ID
    let sitesArray = []; // 로드된 전체 대시보드 설정들
    let siteConfig = null; // 현재 대시보드의 특정 설정 객체

    // DOM Elements
    const credentialsInfoCard = document.getElementById('credentialsInfoCard');
    const connectedRepoName = document.getElementById('connectedRepoName');
    const authErrorCard = document.getElementById('authErrorCard');
    const editSettingsBtn = document.getElementById('editSettingsBtn');
    
    const dashboardTitle = document.getElementById('dashboardTitle');
    const dashboardDescription = document.getElementById('dashboardDescription');
    
    const managerCard = document.getElementById('managerCard');
    const newKeywordInput = document.getElementById('newKeywordInput');
    const addKeywordBtn = document.getElementById('addKeywordBtn');
    const loadingKeywords = document.getElementById('loadingKeywords');
    const keywordList = document.getElementById('keywordList');
    const keywordCount = document.getElementById('keywordCount');
    
    // Modal Elements
    const dashboardModal = document.getElementById('dashboardModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const submitModalBtn = document.getElementById('submitModalBtn');
    
    const modalSiteId = document.getElementById('modalSiteId');
    const modalSiteName = document.getElementById('modalSiteName');
    const modalSiteDesc = document.getElementById('modalSiteDesc');
    const modalUrlTemplate = document.getElementById('modalUrlTemplate');
    const modalListSelector = document.getElementById('modalListSelector');
    const modalItemSelector = document.getElementById('modalItemSelector');
    const modalTitleSelector = document.getElementById('modalTitleSelector');
    const modalLinkSelector = document.getElementById('modalLinkSelector');
    const modalInterval = document.getElementById('modalInterval');
    
    const loadingOverlay = document.getElementById('loadingOverlay');
    const overlayText = document.getElementById('overlayText');
    const toastContainer = document.getElementById('toastContainer');

    // Page Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // 쿼리 매개변수 ?site=xxx 조회
      const params = new URLSearchParams(window.location.search);
      currentSiteId = params.get('site');
      
      if (!currentSiteId) {
        // 기본값 세팅 또는 경고
        currentSiteId = 'aagag';
      }
      
      loadSavedConfig();
      
      addKeywordBtn.addEventListener('click', addNewKeyword);
      newKeywordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addNewKeyword();
      });
      
      editSettingsBtn.addEventListener('click', openEditModal);
      closeModalBtn.addEventListener('click', closeEditModal);
      cancelModalBtn.addEventListener('click', closeEditModal);
      submitModalBtn.addEventListener('click', saveSettings);
    });

    // 1. Toast Notification Helper
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
        <span>${message}</span>
      `;
      toastContainer.appendChild(toast);
      
      setTimeout(() => toast.classList.add('active'), 50);
      
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // 2. Overlay Loader Control
    function setOverlay(show, text = '깃허브 데이터 업데이트 중...') {
      overlayText.textContent = text;
      if (show) {
        loadingOverlay.classList.add('active');
      } else {
        loadingOverlay.classList.remove('active');
      }
    }

    // 3. Load configuration from LocalStorage
    function loadSavedConfig() {
      const savedToken = localStorage.getItem('github_token');
      const savedRepo = localStorage.getItem('github_repo');
      
      if (savedToken && savedRepo) {
        CONFIG.token = savedToken.trim();
        CONFIG.repo = savedRepo.trim();
        
        connectedRepoName.textContent = CONFIG.repo;
        credentialsInfoCard.style.display = 'block';
        authErrorCard.style.display = 'none';
        managerCard.style.display = 'block';
        
        fetchConfig();
      } else {
        CONFIG.token = '';
        CONFIG.repo = '';
        CONFIG.sha = '';
        
        credentialsInfoCard.style.display = 'none';
        authErrorCard.style.display = 'block';
        managerCard.style.display = 'none';
      }
    }

    // 4. Fetch config.json from GitHub
    async function fetchConfig() {
      loadingKeywords.style.display = 'flex';
      keywordList.style.display = 'none';
      
      try {
        const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/config.json?t=${Date.now()}`, {
          headers: {
            'Authorization': `Bearer ${CONFIG.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!response.ok) {
          throw new Error(`GitHub API HTTP ${response.status}`);
        }
        
        const data = await response.json();
        CONFIG.sha = data.sha;
        
        const utf8String = atob(data.content.replace(/\s/g, ''));
        const decodeContent = decodeURIComponent(escape(utf8String));
        
        sitesArray = JSON.parse(decodeContent);
        
        // 현재 대시보드 ID에 일치하는 설정 필터링
        siteConfig = sitesArray.find(s => s.id === currentSiteId);
        
        if (!siteConfig) {
          showToast(`ID가 "${currentSiteId}"인 대시보드 설정을 찾을 수 없습니다.`, 'danger');
          dashboardTitle.textContent = '알 수 없는 대시보드';
          dashboardDescription.textContent = 'config.json 파일에 설정이 정의되어 있지 않습니다.';
          loadingKeywords.style.display = 'none';
          return;
        }
        
        // 타이틀 및 정보 적용
        dashboardTitle.textContent = siteConfig.name;
        dashboardDescription.textContent = siteConfig.description || '커스텀 RSS 피드를 구독 및 관리합니다';
        
        renderKeywords();
      } catch (error) {
        console.error(error);
        showToast(`설정을 로드하는 데 실패했습니다: ${error.message}`, 'danger');
        loadingKeywords.style.display = 'none';
      }
    }

    function sanitizeFilename(name) {
      return name.replace(/[\/\\:\*\?"<>\|]/g, '_');
    }

    // 5. Render keywords in HTML (3줄 표시 리포맷팅 요구사항 구현)
    function renderKeywords() {
      loadingKeywords.style.display = 'none';
      keywordList.innerHTML = '';
      
      const keywords = siteConfig.keywords || [];
      
      if (keywords.length === 0) {
        keywordList.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-folder-open"></i>
            등록된 키워드가 없습니다. 새 키워드를 추가해 보세요!
          </div>
        `;
        keywordList.style.display = 'block';
        keywordCount.textContent = '0';
        return;
      }
      
      keywordCount.textContent = keywords.length;
      
      keywords.forEach((kw) => {
        const item = document.createElement('div');
        item.className = 'keyword-item';
        
        const owner = CONFIG.repo.split('/')[0];
        const repoName = CONFIG.repo.split('/')[1];
        
        const safeKw = sanitizeFilename(kw);
        const encodedSafeKw = encodeURIComponent(safeKw);
        
        // 정적 XML RSS 주소 매핑
        const rssUrl = `https://${owner}.github.io/${repoName}/${siteConfig.id}/${encodedSafeKw}.xml`;
        
        // 키워드 이름, 주소, 날짜 총 3줄로 분할 렌더링
        item.innerHTML = `
          <div class="keyword-info" style="display: flex; flex-direction: column; gap: 0.4rem; padding: 0.2rem 0; max-width: 85%;">
            <!-- 1행: 키워드 이름 -->
            <span class="keyword-name" style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);">${kw}</span>
            <!-- 2행: RSS URL -->
            <div class="keyword-url-row" style="font-size: 0.85rem; color: var(--neon-blue); cursor: pointer; word-break: break-all;" onclick="copyToClipboard('${rssUrl}')" title="클릭하여 주소 복사">
              <i class="fa-solid fa-link" style="margin-right: 4px;"></i>${rssUrl}
            </div>
            <!-- 3행: 날짜 및 주기 정보 -->
            <div class="keyword-meta-row" style="font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.8rem;">
              <span class="keyword-updated" id="updated-${encodedSafeKw}">
                <i class="fa-regular fa-clock" style="margin-right: 4px;"></i>조회 중...
              </span>
              <span style="color: rgba(255, 255, 255, 0.15)">|</span>
              <span>
                <i class="fa-solid fa-rotate" style="margin-right: 4px; font-size: 0.75rem;"></i>주기: ${siteConfig.intervalMinutes}분
              </span>
            </div>
          </div>
          <div class="keyword-actions">
            <button class="action-btn" onclick="copyToClipboard('${rssUrl}')" style="background:none; border:none; color:var(--text-muted); font-size:1rem; padding:0.4rem; cursor:pointer;" title="주소 복사">
              <i class="fa-solid fa-copy"></i>
            </button>
            <button class="action-btn delete-btn" onclick="deleteKeyword('${kw}')" style="background:none; border:none; color:var(--text-muted); font-size:1rem; padding:0.4rem; cursor:pointer;" title="삭제">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
        keywordList.appendChild(item);
      });
      
      keywordList.style.display = 'flex';
      
      // 각 키워드 업데이트 시각 비동기 호출
      keywords.forEach(async (kw) => {
        const safeKw = sanitizeFilename(kw);
        const encodedSafeKw = encodeURIComponent(safeKw);
        const updatedEl = document.getElementById(`updated-${encodedSafeKw}`);
        
        const dateStr = await fetchLastUpdatedDate(kw);
        if (dateStr) {
          updatedEl.innerHTML = `<i class="fa-regular fa-clock" style="margin-right: 4px;"></i>${formatDate(dateStr)}`;
        } else {
          updatedEl.innerHTML = `<i class="fa-regular fa-clock" style="margin-right: 4px;"></i>업데이트 대기 중`;
        }
      });
    }

    // 6. Fetch last commit date of the RSS file
    async function fetchLastUpdatedDate(keyword) {
      try {
        const safeKw = sanitizeFilename(keyword);
        const encodedSafeKw = encodeURIComponent(safeKw);
        
        const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/commits?path=${siteConfig.id}/${encodedSafeKw}.xml&per_page=1&t=${Date.now()}`, {
          headers: {
            'Authorization': `Bearer ${CONFIG.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!response.ok) {
          return null;
        }
        
        const commits = await response.json();
        if (commits && commits.length > 0) {
          return commits[0].commit.author.date;
        }
        return null;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    // 7. Format ISO Date to YYYY.MM.DD_HH:mm:ss
    function formatDate(isoString) {
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '형식 오류';
      
      const YYYY = d.getFullYear();
      const MM = String(d.getMonth() + 1).padStart(2, '0');
      const DD = String(d.getDate()).padStart(2, '0');
      
      const HH = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      
      return `${YYYY}.${MM}.${DD}_${HH}:${mm}:${ss}`;
    }

    // 8. Copy RSS Link to Clipboard
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('RSS 피드 링크가 클립보드에 복사되었습니다!');
      }).catch(err => {
        showToast('링크 복사에 실패했습니다.', 'danger');
      });
    }

    // 9. Update config.json in GitHub
    async function updateGithubFile(newSites, successMessage) {
      setOverlay(true, '깃허브 데이터 업데이트 및 커밋 진행 중...');
      
      try {
        const jsonString = JSON.stringify(newSites, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));
        
        const body = {
          message: `chore: update config.json keywords for site ${currentSiteId}`,
          content: encodedContent
        };
        
        if (CONFIG.sha) {
          body.sha = CONFIG.sha;
        }
        
        const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/config.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${CONFIG.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        
        if (!response.ok) {
          throw new Error(`GitHub API HTTP ${response.status}`);
        }
        
        const resData = await response.json();
        CONFIG.sha = resData.content.sha;
        sitesArray = newSites;
        siteConfig = sitesArray.find(s => s.id === currentSiteId);
        
        setOverlay(false);
        showToast(successMessage);
        showToast('Github Actions 빌드가 실행되었습니다. (약 2분 소요)', 'success');
        
        renderKeywords();
      } catch (error) {
        console.error(error);
        setOverlay(false);
        showToast(`업데이트 에러: ${error.message}`, 'danger');
      }
    }

    // 10. Add New Keyword
    function addNewKeyword() {
      const newKeyword = newKeywordInput.value.trim();
      
      if (!newKeyword) {
        showToast('추가할 키워드를 입력하세요.', 'danger');
        return;
      }
      
      const allowedPattern = /^[ㄱ-ㅎㅏ-ㅣ가-힣a-zA-Z0-9\s_-]+$/;
      if (!allowedPattern.test(newKeyword)) {
        showToast('키워드에는 한글, 영문, 숫자, 공백, 하이픈(-), 언더바(_)만 입력 가능합니다.', 'danger');
        return;
      }
      
      const currentKeywords = siteConfig.keywords || [];
      if (currentKeywords.includes(newKeyword)) {
        showToast('이미 등록된 키워드입니다.', 'danger');
        return;
      }
      
      const updatedKeywords = [...currentKeywords, newKeyword];
      
      // sitesArray의 현재 대시보드 키워드 리스트 업데이트
      const updatedSites = sitesArray.map(s => {
        if (s.id === currentSiteId) {
          return { ...s, keywords: updatedKeywords };
        }
        return s;
      });
      
      newKeywordInput.value = '';
      updateGithubFile(updatedSites, `"${newKeyword}" 키워드가 추가되었습니다!`);
    }

    // 11. Delete Keyword
    function deleteKeyword(kw) {
      if (!confirm(`"${kw}" 키워드 수집을 정말 중단하시겠습니까?\n피드 파일도 다음 빌드 때 더 이상 갱신되지 않습니다.`)) {
        return;
      }
      
      const currentKeywords = siteConfig.keywords || [];
      const updatedKeywords = currentKeywords.filter(item => item !== kw);
      
      const updatedSites = sitesArray.map(s => {
        if (s.id === currentSiteId) {
          return { ...s, keywords: updatedKeywords };
        }
        return s;
      });
      
      updateGithubFile(updatedSites, `"${kw}" 키워드가 삭제되었습니다.`);
    }

    // 12. Modal Control for Edit Settings
    function openEditModal() {
      if (!siteConfig) return;
      
      modalSiteId.value = siteConfig.id;
      modalSiteName.value = siteConfig.name;
      modalSiteDesc.value = siteConfig.description || '';
      modalUrlTemplate.value = siteConfig.targetUrlTemplate || '';
      modalListSelector.value = siteConfig.listSelector || '';
      modalItemSelector.value = siteConfig.itemSelector || '';
      modalTitleSelector.value = siteConfig.titleSelector || '';
      modalLinkSelector.value = siteConfig.linkSelector || '';
      modalInterval.value = siteConfig.intervalMinutes || 120;
      
      dashboardModal.classList.add('active');
    }

    function closeEditModal() {
      dashboardModal.classList.remove('active');
    }

    async function saveSettings() {
      const name = modalSiteName.value.trim();
      const desc = modalSiteDesc.value.trim();
      const targetUrlTemplate = modalUrlTemplate.value.trim();
      const listSelector = modalListSelector.value.trim();
      const itemSelector = modalItemSelector.value.trim();
      const titleSelector = modalTitleSelector.value.trim();
      const linkSelector = modalLinkSelector.value.trim();
      const intervalMinutes = parseInt(modalInterval.value);
      
      if (!name || !targetUrlTemplate || !itemSelector) {
        showToast('필수 필드(이름, URL 템플릿, 기사 선택자)를 입력하세요.', 'danger');
        return;
      }
      
      if (!targetUrlTemplate.includes('${keyword}')) {
        showToast('URL 템플릿에는 반드시 ${keyword} 변수가 포함되어야 합니다.', 'danger');
        return;
      }

      const updatedSites = sitesArray.map(s => {
        if (s.id === currentSiteId) {
          return {
            ...s,
            name,
            description: desc,
            targetUrlTemplate,
            listSelector,
            itemSelector,
            titleSelector,
            linkSelector,
            intervalMinutes
          };
        }
        return s;
      });
      
      closeEditModal();
      await updateGithubFile(updatedSites, '대시보드 설정이 수정되었습니다!');
    }
  </script>
</body>
</html>
