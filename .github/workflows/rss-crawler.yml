name: Community RSS Crawler

on:
  push:
    paths:
      - 'config.json' # 웹 대시보드 등에서 설정이 변경되었을 때 즉시 실행
  schedule:
    - cron: '*/30 * * * *' # 매 30분마다 자동 실행
  workflow_dispatch: # Github 웹 UI에서 수동 실행 가능

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 리포지토리에 커밋 및 푸시하기 위해 쓰기 권한 설정

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build RSS Feed
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # 변경된 사항이 있을 때만 커밋 및 푸시 수행 (에러 방지)
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update RSS feeds [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
