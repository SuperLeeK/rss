<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community RSS Portal Hub</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #110e2e 100%);
      --card-bg: rgba(30, 41, 59, 0.5);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-blue: #00f2fe;
      --neon-purple: #4facfe;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --card-hover-border: rgba(99, 102, 241, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Background Neon Glows */
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: -200px;
      left: -100px;
      z-index: -1;
    }
    .glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -200px;
      right: -100px;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 800px;
      z-index: 1;
      text-align: center;
    }

    header {
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -0.05em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 300;
    }

    /* Grid Layout for Dashboard Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
      text-align: left;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Active Dashboard Card Hover */
    .card.active:hover {
      transform: translateY(-8px);
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.3);
      cursor: pointer;
    }

    .card.disabled {
      opacity: 0.6;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .card-icon {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card.active .card-icon {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge.active-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.disabled-badge {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-body h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .card-body p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }
    .card.active:hover .card-footer {
      color: var(--neon-blue);
    }

    footer {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 2rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <header>
      <h1>Community RSS Portal</h1>
      <p>구독 및 관리하고자 하는 커뮤니티의 RSS 대시보드를 선택해 주세요.</p>
    </header>

    <div class="grid">
      <!-- AAGAG Card (Active) -->
      <div class="card active" onclick="location.href='./aagag/'">
        <div>
          <div class="card-header">
            <div class="card-icon"><i class="fa-solid fa-square-rss"></i></div>
            <span class="badge active-badge">운영 중</span>
          </div>
          <div class="card-body">
            <h3>AAGAG RSS</h3>
            <p>AAGAG 미러 게시판의 키워드 검색 결과를 실시간으로 모니터링하고 RSS 피드를 발급합니다.</p>
          </div>
        </div>
        <div class="card-footer">
          대시보드로 입장 <i class="fa-solid fa-arrow-right"></i>
        </div>
      </div>

      <!-- Inven Card (Disabled Placeholder) -->
      <div class="card disabled">
        <div>
          <div class="card-header">
            <div class="card-icon"><i class="fa-solid fa-gamepad"></i></div>
            <span class="badge disabled-badge">준비 중</span>
          </div>
          <div class="card-body">
            <h3>Inven RSS</h3>
            <p>인벤 자유게시판 및 특정 게임 게시판의 실시간 키워드 피드 자동 수집 대시보드입니다.</p>
          </div>
        </div>
        <div class="card-footer">
          준비 중 <i class="fa-solid fa-lock" style="font-size: 0.8rem;"></i>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Community RSS Auto-Crawler Pipeline. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
